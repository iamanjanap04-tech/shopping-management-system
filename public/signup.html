<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ShopMax</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">ShopMax</a>
      <a href="/" class="btn btn-outline">Back to Home</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Sign Up</h1>
      <form id="signupForm">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="name" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="Min 6 characters">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="role">
            <option value="Customer">Customer</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <div id="signupError" class="error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login.html">Login</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('signupForm').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const errEl = document.getElementById('signupError');
      errEl.classList.add('hidden');
      try {
        await api.signup(name, email, password, role);
        alert('Registration successful! Please login.');
        window.location.href = '/login.html';
      } catch (err) {
        errEl.textContent = err.message || 'Signup failed';
        errEl.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
