<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - ShopMax</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">ShopMax</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/products.html">Products</a>
        <a href="/cart.html" class="cart-link">
          <span class="cart-icon">🛒</span>
          <span id="cartCount" class="cart-badge">0</span>
        </a>
        <span id="authButtons"><a href="/login.html" class="btn btn-outline">Login</a></span>
        <span id="userMenu" class="hidden">
          <a href="/orders.html" class="btn btn-outline">My Orders</a>
          <button id="logoutBtn" class="btn btn-outline">Logout</button>
        </span>
      </div>
    </div>
  </header>

  <main class="main-content cart-page">
    <h2>Your Cart</h2>
    <div id="cartContent">
      <div class="loading">Loading...</div>
    </div>
    <div id="cartEmpty" class="hidden cart-empty">
      <p>Your cart is empty.</p>
      <a href="/products.html" class="btn btn-primary">Continue Shopping</a>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      initAuth();
      if (!api.getToken()) {
        alert('Please login to view cart');
        location.href = '/login.html?redirect=' + location.href;
        return;
      }
      loadCart();
    });

    async function loadCart() {
      try {
        const data = await api.getCart();
        document.getElementById('cartCount').textContent = data.items?.length || 0;
        if (!data.items?.length) {
          document.getElementById('cartContent').classList.add('hidden');
          document.getElementById('cartEmpty').classList.remove('hidden');
          return;
        }
        document.getElementById('cartEmpty').classList.add('hidden');
        const formatMoney = (value) => Number(value || 0).toFixed(2);
        document.getElementById('cartContent').innerHTML = `
          <div class="cart-items">
            ${data.items.map(item => `
              <div class="cart-item" data-id="${item.PRODUCT_ID}">
                <img src="${item.IMAGE_URL?.startsWith('/') ? item.IMAGE_URL : '/uploads/' + (item.IMAGE_URL || '')}" onerror="this.src='https://via.placeholder.com/80?text=Img'" alt="">
                <div class="cart-item-info">
                  <a href="/product.html?id=${item.PRODUCT_ID}">${item.NAME}</a>
                  <p>$${formatMoney(item.UNIT_PRICE)} × ${item.QUANTITY} = $${formatMoney(item.SUBTOTAL)}</p>
                  <button class="btn-remove" onclick="removeItem(${item.PRODUCT_ID})">Remove</button>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="cart-summary">
            <h3>Total: $${formatMoney(data.total)}</h3>
            <button id="checkoutBtn" class="btn btn-primary btn-lg">Checkout</button>
          </div>
        `;
        document.getElementById('checkoutBtn').onclick = checkout;
      } catch (e) {
        document.getElementById('cartContent').innerHTML = `<p class="error">${e.message || 'Failed to load cart.'}</p>`;
      }
    }

    async function removeItem(pid) {
      await api.removeFromCart(pid);
      loadCart();
    }

    async function checkout() {
      try {
        const order = await api.createOrder();
        await api.createPayment(order.orderId, order.total || 0);
        alert('Order placed successfully! Order #' + order.orderId);
        location.href = '/orders.html';
      } catch (e) {
        alert(e.message || 'Checkout failed');
      }
    }
  </script>
</body>
</html>
