<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopMax</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">ShopMax</a>
      <a href="/" class="btn btn-outline">Back to Home</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Login</h1>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div id="loginError" class="error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="/signup.html">Sign Up</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      try {
        const res = await api.login(email, password);
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        const params = new URLSearchParams(location.search);
        const redirect = params.get('redirect');
        const role = res.user.role;
        if (redirect && role === 'Customer') window.location.href = redirect;
        else window.location.href = role === 'Admin' ? '/admin.html' : '/';
      } catch (err) {
        errEl.textContent = err.message || 'Login failed';
        errEl.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
